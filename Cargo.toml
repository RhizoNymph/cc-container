[package]
name = "cc-container"
version = "0.1.0"
edition = "2024"
description = "CLI tool for generating containerized AI coding agent environments"
license = "MIT"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env", "string"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }

# Compose types
docker-compose-types = "0.22"

# Template engine
minijinja = { version = "2", features = ["loader"] }

# Ordered maps
indexmap = { version = "2", features = ["serde"] }

# Error handling
thiserror = "2"
anyhow = "1"
miette = { version = "7", features = ["fancy"] }

# Interactive prompts
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
console = "0.15"

# Filesystem
dirs = "6"
walkdir = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Graph (topological sort)
petgraph = "0.7"
which = "8.0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
insta = { version = "1", features = ["yaml"] }
serial_test = "3"

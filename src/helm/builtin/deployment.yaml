{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (not $svc.stateful) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $name }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if $svc.command }}
          command: {{ toJson $svc.command }}
          {{- end }}
          env:
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            exec:
              command: {{ toJson $svc.healthcheck.command }}
            initialDelaySeconds: {{ $svc.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ $svc.healthcheck.periodSeconds }}
            timeoutSeconds: {{ $svc.healthcheck.timeoutSeconds }}
            failureThreshold: {{ $svc.healthcheck.failureThreshold }}
          readinessProbe:
            exec:
              command: {{ toJson $svc.healthcheck.command }}
            initialDelaySeconds: {{ $svc.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ $svc.healthcheck.periodSeconds }}
            timeoutSeconds: {{ $svc.healthcheck.timeoutSeconds }}
            failureThreshold: {{ $svc.healthcheck.failureThreshold }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
{{- end }}

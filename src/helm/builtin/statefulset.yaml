{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.stateful }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "chart.fullname" $ }}-{{ $name }}
  labels:
    {{- include "chart.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "chart.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "chart.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ include "chart.imageRef" $svc.image }}"
          imagePullPolicy: {{ $svc.image.pullPolicy }}
          ports:
            {{- range $svc.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: {{ .protocol }}
            {{- end }}
          {{- if $svc.command }}
          command: {{ toJson $svc.command }}
          {{- end }}
          env:
            {{- range $key, $val := $svc.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- range $key, $secretKey := $svc.envFromSecret }}
          - name: {{ $key }}
            valueFrom:
              secretKeyRef:
                name: {{ include "chart.fullname" $ }}-secrets
                key: {{ $secretKey }}
          {{- end }}
          livenessProbe:
            exec:
              command: {{ toJson $svc.healthcheck.command }}
            initialDelaySeconds: {{ $svc.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ $svc.healthcheck.periodSeconds }}
            timeoutSeconds: {{ $svc.healthcheck.timeoutSeconds }}
            failureThreshold: {{ $svc.healthcheck.failureThreshold }}
          readinessProbe:
            exec:
              command: {{ toJson $svc.healthcheck.command }}
            initialDelaySeconds: {{ $svc.healthcheck.initialDelaySeconds }}
            periodSeconds: {{ $svc.healthcheck.periodSeconds }}
            timeoutSeconds: {{ $svc.healthcheck.timeoutSeconds }}
            failureThreshold: {{ $svc.healthcheck.failureThreshold }}
          volumeMounts:
            {{- range $svc.volumeMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .readOnly }}
              readOnly: {{ .readOnly }}
              {{- end }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $svc.pvcSize }}
        {{- if $.Values.storageClass }}
        storageClassName: {{ $.Values.storageClass }}
        {{- end }}
{{- end }}
{{- end }}

{{- if .Values.ingress }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "chart.fullname" . }}-agent
  labels:
    {{- include "chart.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    {{- include "chart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
{{- end }}
